name: ci-infra-db

on:
  pull_request:
  push:
    branches: [main, homolog]
  workflow_dispatch:

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - run: terraform init -backend=false

      - run: terraform fmt -check

      - run: terraform validate

      - run: terraform plan -input=false -var="vpc_id=vpc-123" -var='private_subnet_ids=["subnet-1","subnet-2"]' -var="app_security_group_id=sg-123" -var="db_password=fake" || true

  apply:
    if: github.event_name == 'workflow_dispatch'
    needs: terraform
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'homolog' }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - run: terraform init

      - run: |
          terraform apply -auto-approve \
            -var="vpc_id=${{ vars.VPC_ID }}" \
            -var='private_subnet_ids=${{ vars.PRIVATE_SUBNET_IDS_JSON }}' \
            -var="app_security_group_id=${{ vars.APP_SECURITY_GROUP_ID }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}"